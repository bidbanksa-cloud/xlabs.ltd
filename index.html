<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>X-Labs | Precision Peptides. Premium Performance.</title>
  <meta name="description" content="X-Labs — Precision Peptides. Premium Performance.">
  <meta name="theme-color" content="#000000">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(18px,4vw,46px);overflow-x:hidden}
    .wrap{width:min(100%,980px);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .logo{display:block;width:min(82vw,760px);height:auto;max-height:72svh;object-fit:contain;margin:0 auto;image-rendering:auto;filter:drop-shadow(0 0 18px rgba(24,218,232,.10))}
    .shop{display:inline-block;margin-top:clamp(18px,3vw,28px);color:#18dbe8;text-decoration:none;font-weight:700;font-size:clamp(.95rem,1.9vw,1.28rem);letter-spacing:.22em;text-transform:uppercase;padding:8px 2px 10px;border-bottom:1px solid rgba(24,219,232,.45);transition:color .2s,border-color .2s,text-shadow .2s}
    .shop:hover,.shop:focus-visible{color:#8ff7ff;border-color:#8ff7ff;text-shadow:0 0 16px rgba(24,219,232,.35);outline:none}
    @media(max-width:700px){
      body{padding:22px 14px}
      .wrap{width:100%}
      .logo{width:min(94vw,760px);max-height:68svh}
      .shop{margin-top:18px;font-size:clamp(.82rem,4vw,1rem);letter-spacing:.13em}
    }
    @media(max-height:620px) and (orientation:landscape){
      body{padding:12px}
      .logo{max-height:70vh;width:min(68vw,720px)}
      .shop{margin-top:10px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="https://raw.githubusercontent.com/bidbanksa-cloud/xlabs.ltd/main/xlabs-logo-v2.jpg?v=20260830-1508" alt="X-Labs — Precision Peptides. Premium Performance." width="760" height="544" decoding="async" fetchpriority="high" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/bidbanksa-cloud/xlabs.ltd/main/xlabs-logo.jpg?v=20260830-1508'">
    <a class="shop" href="https://www.pepshop.co.za/" rel="noopener">WWW.PEPSHOP.CO.ZA</a>
  </main>
</body>
</html>
