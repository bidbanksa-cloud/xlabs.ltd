<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>X-Labs | Precision Peptides. Premium Performance.</title>
  <meta name="description" content="X-Labs — Precision Peptides. Premium Performance.">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="https://www.xlabs.ltd/">
  <script>
    (function () {
      var canonicalHost = 'www.xlabs.ltd';
      if (window.location.protocol !== 'https:' || window.location.hostname !== canonicalHost) {
        window.location.replace('https://' + canonicalHost + window.location.pathname + window.location.search + window.location.hash);
      }
    }());
  </script>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(16px,3vw,34px);overflow-x:hidden}
    .wrap{width:min(100%,1120px);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .logo-shell{width:min(92vw,980px);display:flex;align-items:center;justify-content:center}
    .logo{display:block;width:100%;height:auto;max-height:78svh;object-fit:contain;margin:0 auto;image-rendering:auto;filter:drop-shadow(0 0 22px rgba(24,218,232,.14))}
    .shop{display:inline-block;margin-top:clamp(12px,2vw,22px);color:#18dbe8;text-decoration:none;font-weight:700;font-size:clamp(.95rem,1.9vw,1.28rem);letter-spacing:.22em;text-transform:uppercase;padding:8px 2px 10px;border-bottom:1px solid rgba(24,219,232,.45);transition:color .2s,border-color .2s,text-shadow .2s}
    .shop:hover,.shop:focus-visible{color:#8ff7ff;border-color:#8ff7ff;text-shadow:0 0 16px rgba(24,219,232,.35);outline:none}
    @media(max-width:700px){
      body{padding:14px 10px}
      .wrap{width:100%}
      .logo-shell{width:96vw}
      .logo{max-height:74svh}
      .shop{margin-top:12px;font-size:clamp(.82rem,4vw,1rem);letter-spacing:.13em}
    }
    @media(max-height:620px) and (orientation:landscape){
      body{padding:8px}
      .logo-shell{width:min(74vw,860px)}
      .logo{max-height:78vh}
      .shop{margin-top:7px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo-shell">
      <img
        class="logo"
        src="https://www.pepshop.co.za/assets/xlabs-supplier-logo.jpeg?v=20260902"
        alt="X-Labs — Precision Peptides. Premium Performance."
        width="1448"
        height="1086"
        decoding="async"
        fetchpriority="high"
        referrerpolicy="no-referrer"
        onerror="this.onerror=null;this.src='./xlabs-logo-v2.jpg?v=20260902'"
      >
    </div>
    <a class="shop" href="https://www.pepshop.co.za/" rel="noopener">WWW.PEPSHOP.CO.ZA</a>
  </main>
</body>
</html>
